[package]
name = "tokenatlas-parse"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
rusqlite = { version = "0.32.1", features = ["bundled"] }
sha2 = "0.10.9"
ryu = "1.0.23"
num-bigint = "0.4.6"
num-traits = "0.2"
chrono = { version = "0.4.44", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
regex = "1.12.3"
serde = "1"
serde_json = "1.0.150"
memchr = "2.8.1"
aho-corasick = "1.1.4"
zstd = "0.13.3"

[target.'cfg(windows)'.dependencies]
mimalloc = "0.1.52"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
