[package]
name = "tokenatlas-monitor"
version = "0.1.0"
edition = "2024"
description = "Standalone subscription window monitor"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
directories = "6"
egui = { version = "0.33.3", features = ["default_fonts"] }
egui_software_backend = { version = "=0.0.2", default-features = false, features = ["std"] }
egui-winit = { version = "0.33.3", default-features = false, features = ["x11", "wayland", "clipboard"] }
softbuffer = "0.4"
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
winit = "0.30"
bytemuck = "1"
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

